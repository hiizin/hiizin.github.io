    ===================================================== */
const positions = particleGeometry .attributes .position .array;
for (let i = 0;
i < particleCount;
i++ ) { const i3 = i * 3;
positions[i3 + 1] += particleSpeeds[i];
positions[i3] += Math.sin(time * .15 + i ) * .001;
if (positions[i3 + 1] >
46 ) { positions[i3 + 1] = 0; } }
particleGeometry .attributes .position .needsUpdate = true;
/* =====================================================
       CITY
    ===================================================== */
city.position.y = Math.sin(time * .18 ) * .12;
/* =====================================================
       LIGHT BEAM
    ===================================================== */
beamMaterial .uniforms .time .value = time;
/* =====================================================
       SUBTLE WORLD MOVEMENT
    ===================================================== */
scene.rotation.y = Math.sin(time * .025 ) * .003;
/* =====================================================
       RENDER
    ===================================================== */
renderer.render(scene, camera ); }
/* =========================================================
   START
========================================================= */
animate();
/* =========================================================
   RESIZE
========================================================= */
window.addEventListener("resize", () => { camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight );
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5 ) ); } );

window.__navReady=true;document.getElementById("bg").style.display="none";
</script>
